<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Brand Indigo to Cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glassmorphic Top Sheen -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.65" />
    </linearGradient>

    <!-- Subtle Ambient & Glow Shadow -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>

    <!-- Text Depth Shadow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050a19" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow and Gradient -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#brandGrad)" filter="url(#cardShadow)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Top Glass Highlight Overlay -->
  <rect x="36" y="36" width="440" height="220" rx="108" fill="url(#topSheen)" style="clip-path: inset(0 0 0 0 round 108px);" />

  <!-- Monogram Lettering -->
  <text x="256" y="338" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="224" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#textGlow)" letter-spacing="-3">AM</text>
</svg>
